<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="594" viewBox="0 0 1260 594" role="img">
<title>结果决定下一步，而不是每次都加厚模型</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#286482"/></marker></defs>
<rect width="1260" height="594" fill="#faf9f5"/><g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="53" font-size="30" fill="#202c35" font-weight="600" text-anchor="start">结果决定下一步，而不是每次都加厚模型</text><text x="42" y="89" font-size="19" fill="#566570" font-weight="400" text-anchor="start">流程示意 · 所有分支都保留原工况、判据和未解决项</text><rect x="42" y="130" width="1176" height="106" rx="10" fill="#fff" stroke="#d6dbdc"/><rect x="42" y="130" width="5" height="106" fill="#b65b2b"/><text x="64" y="175" font-size="22" fill="#b65b2b" font-weight="600" text-anchor="start">有效失败</text><path d="M375 182 H439" fill="none" stroke="#286482" stroke-width="2.5" marker-end="url(#arrow)"/><text x="465" y="172" font-size="25" fill="#202c35" font-weight="600" text-anchor="start">改设计，再分析</text><text x="465" y="206" font-size="19" fill="#566570" font-weight="400" text-anchor="start">定位薄弱截面、载荷路径、导热瓶颈等</text><rect x="42" y="257" width="1176" height="106" rx="10" fill="#fff" stroke="#d6dbdc"/><rect x="42" y="257" width="5" height="106" fill="#286482"/><text x="64" y="302" font-size="22" fill="#286482" font-weight="600" text-anchor="start">证据不足 / 分析无效</text><path d="M375 309 H439" fill="none" stroke="#286482" stroke-width="2.5" marker-end="url(#arrow)"/><text x="465" y="299" font-size="25" fill="#202c35" font-weight="600" text-anchor="start">先修分析或补充输入</text><text x="465" y="333" font-size="19" fill="#566570" font-weight="400" text-anchor="start">核对材料、网格、边界、接触与适用范围</text><rect x="42" y="384" width="1176" height="106" rx="10" fill="#fff" stroke="#d6dbdc"/><rect x="42" y="384" width="5" height="106" fill="#286482"/><text x="64" y="429" font-size="22" fill="#286482" font-weight="600" text-anchor="start">所述模型下通过</text><path d="M375 436 H439" fill="none" stroke="#286482" stroke-width="2.5" marker-end="url(#arrow)"/><text x="465" y="426" font-size="25" fill="#202c35" font-weight="600" text-anchor="start">继续其他必需检查</text><text x="465" y="460" font-size="19" fill="#566570" font-weight="400" text-anchor="start">不自动变成安装通过、整机通过或产品认证</text><text x="42" y="558" font-size="18" fill="#566570" font-weight="400" text-anchor="start">独立成立的失败仍然有用；某一项证据不足，不会抹掉其他已确认的问题。</text></g></svg>