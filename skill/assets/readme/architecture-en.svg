<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="696" viewBox="0 0 1260 696" role="img">
<title>From CAD geometry to actionable engineering feedback</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#286482"/></marker></defs>
<rect width="1260" height="696" fill="#faf9f5"/><g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="54" font-size="30" fill="#202c35" font-weight="600" text-anchor="start">From CAD geometry to actionable engineering feedback</text><text x="42" y="91" font-size="19" fill="#566570" font-weight="400" text-anchor="start">Concept architecture · the Agent orchestrates files and CLI calls</text><rect x="42" y="120" width="1176" height="64" rx="10" fill="#eaf0f1" stroke="#d6dbdc"/><text x="66" y="160" font-size="23" fill="#202c35" font-weight="600" text-anchor="start">User → Agent: select checks, supply physical inputs, preserve the design goal</text><path d="M208 184 V232" fill="none" stroke="#286482" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M628 184 V232" fill="none" stroke="#286482" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1048 184 V232" fill="none" stroke="#286482" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="42" y="240" width="336" height="182" rx="10" fill="#fff" stroke="#d6dbdc"/><text x="64" y="271" font-size="17" fill="#286482" font-weight="600" text-anchor="start">CAD SKILL</text><text x="64" y="311" font-size="22" fill="#202c35" font-weight="600" text-anchor="start">text-to-cad / SimpleCADAPI</text><text x="64" y="354" font-size="17" fill="#566570" font-weight="400" text-anchor="start">Parametric modeling and revision</text><text x="64" y="384" font-size="17" fill="#566570" font-weight="400" text-anchor="start">Export STEP / robot URDF</text><rect x="462" y="240" width="336" height="182" rx="10" fill="#fff" stroke="#d6dbdc"/><text x="484" y="271" font-size="17" fill="#286482" font-weight="600" text-anchor="start">SIMPLECAE</text><text x="484" y="311" font-size="22" fill="#202c35" font-weight="600" text-anchor="start">Targeted analysis</text><text x="484" y="354" font-size="17" fill="#566570" font-weight="400" text-anchor="start">Material / load / support / heat</text><text x="484" y="384" font-size="17" fill="#566570" font-weight="400" text-anchor="start">Select relevant parts and cases</text><rect x="882" y="240" width="336" height="182" rx="10" fill="#fff" stroke="#d6dbdc"/><text x="904" y="271" font-size="17" fill="#286482" font-weight="600" text-anchor="start">RESULTS + VIEWER</text><text x="904" y="311" font-size="22" fill="#202c35" font-weight="600" text-anchor="start">For people and Agents</text><text x="904" y="354" font-size="17" fill="#566570" font-weight="400" text-anchor="start">Location, criterion, validity &amp; gaps</text><text x="904" y="384" font-size="17" fill="#566570" font-weight="400" text-anchor="start">JSON · fields · iteration history</text><path d="M378 325 H450" fill="none" stroke="#286482" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M798 325 H870" fill="none" stroke="#286482" stroke-width="2.5" marker-end="url(#arrow)"/><text x="420" y="302" font-size="15" fill="#566570" font-weight="400" text-anchor="middle">Model</text><text x="840" y="302" font-size="15" fill="#566570" font-weight="400" text-anchor="middle">Evidence</text><path d="M628 422 V458" fill="none" stroke="#286482" stroke-width="2.5"/><rect x="284" y="458" width="688" height="100" rx="10" fill="#f0f3f2" stroke="#d6dbdc"/><text x="310" y="491" font-size="21" fill="#202c35" font-weight="600" text-anchor="start">Local computation toolkit</text><text x="310" y="528" font-size="19" fill="#566570" font-weight="400" text-anchor="start">Gmsh mesh  /  CalculiX FEM  /  NumPy · SciPy calculations</text><path d="M1048 422 V596 H208 V436" fill="none" stroke="#286482" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="390" y="578" width="480" height="38" rx="10" fill="#faf9f5" stroke="#faf9f5"/><text x="630" y="604" font-size="18" fill="#286482" font-weight="600" text-anchor="middle">Agent turns valid evidence into the next revision</text><text x="42" y="660" font-size="17" fill="#566570" font-weight="400" text-anchor="start">CAD skills are interchangeable collaborators, not auto-called dependencies. Geometry alone does not define the physics.</text></g></svg>