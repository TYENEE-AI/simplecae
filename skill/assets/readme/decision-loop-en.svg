<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="594" viewBox="0 0 1260 594" role="img">
<title>The result determines the next action</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#286482"/></marker></defs>
<rect width="1260" height="594" fill="#faf9f5"/><g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="53" font-size="30" fill="#202c35" font-weight="600" text-anchor="start">The result determines the next action</text><text x="42" y="89" font-size="19" fill="#566570" font-weight="400" text-anchor="start">Decision map · keep the original conditions, criteria and unresolved items</text><rect x="42" y="130" width="1176" height="106" rx="10" fill="#fff" stroke="#d6dbdc"/><rect x="42" y="130" width="5" height="106" fill="#b65b2b"/><text x="64" y="175" font-size="22" fill="#b65b2b" font-weight="600" text-anchor="start">VALID FAILURE</text><path d="M375 182 H439" fill="none" stroke="#286482" stroke-width="2.5" marker-end="url(#arrow)"/><text x="465" y="172" font-size="25" fill="#202c35" font-weight="600" text-anchor="start">Revise CAD, then rerun</text><text x="465" y="206" font-size="19" fill="#566570" font-weight="400" text-anchor="start">Locate the weak section, load path or thermal bottleneck</text><rect x="42" y="257" width="1176" height="106" rx="10" fill="#fff" stroke="#d6dbdc"/><rect x="42" y="257" width="5" height="106" fill="#286482"/><text x="64" y="302" font-size="22" fill="#286482" font-weight="600" text-anchor="start">INSUFFICIENT / INVALID</text><path d="M375 309 H439" fill="none" stroke="#286482" stroke-width="2.5" marker-end="url(#arrow)"/><text x="465" y="299" font-size="25" fill="#202c35" font-weight="600" text-anchor="start">Repair the analysis or inputs</text><text x="465" y="333" font-size="19" fill="#566570" font-weight="400" text-anchor="start">Review material, mesh, boundaries, contacts and scope</text><rect x="42" y="384" width="1176" height="106" rx="10" fill="#fff" stroke="#d6dbdc"/><rect x="42" y="384" width="5" height="106" fill="#286482"/><text x="64" y="429" font-size="22" fill="#286482" font-weight="600" text-anchor="start">MODEL-SCOPE PASS</text><path d="M375 436 H439" fill="none" stroke="#286482" stroke-width="2.5" marker-end="url(#arrow)"/><text x="465" y="426" font-size="25" fill="#202c35" font-weight="600" text-anchor="start">Continue required checks</text><text x="465" y="460" font-size="19" fill="#566570" font-weight="400" text-anchor="start">Does not grant mounting, robot or product acceptance</text><text x="42" y="558" font-size="18" fill="#566570" font-weight="400" text-anchor="start">An unresolved check does not erase an independently established failure.</text></g></svg>