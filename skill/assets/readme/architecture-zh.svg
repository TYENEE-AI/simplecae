<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="696" viewBox="0 0 1260 696" role="img">
<title>从模型到设计反馈：SimpleCAE 在哪里起作用</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#286482"/></marker></defs>
<rect width="1260" height="696" fill="#faf9f5"/><g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="54" font-size="30" fill="#202c35" font-weight="600" text-anchor="start">从模型到设计反馈：SimpleCAE 在哪里起作用</text><text x="42" y="91" font-size="19" fill="#566570" font-weight="400" text-anchor="start">概念架构 · Agent 编排流程，技能通过文件与 CLI 协作</text><rect x="42" y="120" width="1176" height="64" rx="10" fill="#eaf0f1" stroke="#d6dbdc"/><text x="66" y="160" font-size="23" fill="#202c35" font-weight="600" text-anchor="start">用户需求 → Agent：选检查对象，补充物理条件，保持设计目标</text><path d="M208 184 V232" fill="none" stroke="#286482" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M628 184 V232" fill="none" stroke="#286482" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1048 184 V232" fill="none" stroke="#286482" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="42" y="240" width="336" height="182" rx="10" fill="#fff" stroke="#d6dbdc"/><text x="64" y="271" font-size="17" fill="#286482" font-weight="600" text-anchor="start">CAD SKILL</text><text x="64" y="311" font-size="22" fill="#202c35" font-weight="600" text-anchor="start">text-to-cad / SimpleCADAPI</text><text x="64" y="354" font-size="17" fill="#566570" font-weight="400" text-anchor="start">参数化建模、装配与修改</text><text x="64" y="384" font-size="17" fill="#566570" font-weight="400" text-anchor="start">导出 STEP / 机器人 URDF</text><rect x="462" y="240" width="336" height="182" rx="10" fill="#fff" stroke="#d6dbdc"/><text x="484" y="271" font-size="17" fill="#286482" font-weight="600" text-anchor="start">SIMPLECAE</text><text x="484" y="311" font-size="22" fill="#202c35" font-weight="600" text-anchor="start">按需检查与计算</text><text x="484" y="354" font-size="17" fill="#566570" font-weight="400" text-anchor="start">材料、载荷、安装 / 热边界</text><text x="484" y="384" font-size="17" fill="#566570" font-weight="400" text-anchor="start">选择关键零件与工况</text><rect x="882" y="240" width="336" height="182" rx="10" fill="#fff" stroke="#d6dbdc"/><text x="904" y="271" font-size="17" fill="#286482" font-weight="600" text-anchor="start">RESULTS + VIEWER</text><text x="904" y="311" font-size="22" fill="#202c35" font-weight="600" text-anchor="start">给人看，也给 Agent 用</text><text x="904" y="354" font-size="17" fill="#566570" font-weight="400" text-anchor="start">位置、控制判据、有效性与缺项</text><text x="904" y="384" font-size="17" fill="#566570" font-weight="400" text-anchor="start">结果 JSON · 场数据 · 迭代记录</text><path d="M378 325 H450" fill="none" stroke="#286482" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M798 325 H870" fill="none" stroke="#286482" stroke-width="2.5" marker-end="url(#arrow)"/><text x="420" y="302" font-size="15" fill="#566570" font-weight="400" text-anchor="middle">模型</text><text x="840" y="302" font-size="15" fill="#566570" font-weight="400" text-anchor="middle">证据</text><path d="M628 422 V458" fill="none" stroke="#286482" stroke-width="2.5"/><rect x="284" y="458" width="688" height="100" rx="10" fill="#f0f3f2" stroke="#d6dbdc"/><text x="310" y="491" font-size="21" fill="#202c35" font-weight="600" text-anchor="start">本地计算工具包</text><text x="310" y="528" font-size="19" fill="#566570" font-weight="400" text-anchor="start">Gmsh 网格  /  CalculiX 有限元  /  NumPy · SciPy 数值计算</text><path d="M1048 422 V596 H208 V436" fill="none" stroke="#286482" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="390" y="578" width="480" height="38" rx="10" fill="#faf9f5" stroke="#faf9f5"/><text x="630" y="604" font-size="18" fill="#286482" font-weight="600" text-anchor="middle">Agent 根据有效证据决定下一次修改</text><text x="42" y="660" font-size="17" fill="#566570" font-weight="400" text-anchor="start">CAD 工具是可替换的协作者；SimpleCAE 不会自动调用它们，也不会只凭模型推断材料或安装条件。</text></g></svg>